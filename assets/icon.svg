<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- Microphone body -->
  <rect x="432" y="280" width="160" height="260" rx="80" fill="white"/>
  <!-- Microphone grill lines -->
  <line x1="462" y1="340" x2="562" y2="340" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="462" y1="370" x2="562" y2="370" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="462" y1="400" x2="562" y2="400" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="462" y1="430" x2="562" y2="430" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <line x1="462" y1="460" x2="562" y2="460" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
  <!-- Microphone arc (U-shape holder) -->
  <path d="M370 420 A142 142 0 0 0 654 420" fill="none" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Microphone stand -->
  <line x1="512" y1="562" x2="512" y2="660" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Microphone base -->
  <line x1="432" y1="660" x2="592" y2="660" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Sound wave arcs -->
  <path d="M310 240 A240 240 0 0 1 714 240" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
  <path d="M240 190 A310 310 0 0 1 784 190" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.3"/>
</svg>