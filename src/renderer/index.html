<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="height=device-height, width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="angrymiao-voice-control" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="angrymiao-voice-control" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <title>Angrymiao-Voice-Control</title>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-B365F44W6E"
    ></script>
    <script
      defer
      data-domain="app.chatboxai.app"
      src="https://plausible.midway.run/js/script.local.hash.js"
    ></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // gtag('config', 'G-B365F44W6E');
    </script>
    <script>
      var initialTheme = localStorage.getItem("initial-theme");
      if (initialTheme === "light" || initialTheme === "dark") {
        document.documentElement.setAttribute("data-theme", initialTheme);
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          initialTheme
        );
      }
    </script>
    <style>
      html[data-theme="dark"] {
        background-color: #242424;
      }

      .splash-screen {
        position: fixed;
        z-index: 99999;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        opacity: 1;
        background-color: #fff;
        overflow: hidden;
      }
      html[data-theme="dark"] .splash-screen {
        background-color: #242424;
      }

      .splash-screen-top {
        flex: 2;
      }
      .splash-screen-bottom {
        flex: 3;
        width: 100%;
        position: relative;
      }
      .splash-screen-content {
        flex: 0 0 auto;
        position: relative;
      }

      .splash-screen-logo {
        display: block;
        color: #495057;
      }
      html[data-theme="dark"] .splash-screen-logo {
        color: #ced4da;
      }

      .splash-screen-fade-out {
        animation: fade-out 0.5s ease-in-out forwards;
      }

      @keyframes fade-out {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div class="splash-screen">
      <div class="splash-screen-top"></div>
      <div class="splash-screen-content">
        <svg
          class="splash-screen-logo"
          width="80"
          height="80"
          viewBox="0 0 1024 1024"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient id="splash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#7C3AED"/>
              <stop offset="100%" style="stop-color:#3B82F6"/>
            </linearGradient>
          </defs>
          <rect width="1024" height="1024" rx="220" fill="url(#splash-bg)"/>
          <rect x="432" y="280" width="160" height="260" rx="80" fill="white"/>
          <line x1="462" y1="340" x2="562" y2="340" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
          <line x1="462" y1="370" x2="562" y2="370" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
          <line x1="462" y1="400" x2="562" y2="400" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
          <line x1="462" y1="430" x2="562" y2="430" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
          <line x1="462" y1="460" x2="562" y2="460" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
          <path d="M370 420 A142 142 0 0 0 654 420" fill="none" stroke="white" stroke-width="28" stroke-linecap="round"/>
          <line x1="512" y1="562" x2="512" y2="660" stroke="white" stroke-width="28" stroke-linecap="round"/>
          <line x1="432" y1="660" x2="592" y2="660" stroke="white" stroke-width="28" stroke-linecap="round"/>
          <path d="M310 240 A240 240 0 0 1 714 240" fill="none" stroke="white" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
          <path d="M240 190 A310 310 0 0 1 784 190" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.3"/>
        </svg>
      </div>
      <div class="splash-screen-bottom" id="log-root"></div>
    </div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
