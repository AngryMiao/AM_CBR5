productName: Angrymiao-Voice-Control
appId: xyz.angrymiao.voicecontrol
asar: true
asarUnpack:
  - "**\\*.{node,dll}"
  - "**/node_modules/libsql/**"
files:
  - "dist"
  # - "!dist/**/*.map"
  # - "!dist/**/stats.html"
  - "node_modules"
  - "package.json"

afterSign: .erb/scripts/notarize.js
afterPack: .erb/scripts/patch-libsql.cjs

# releaseInfo:
#   releaseNotes: See the changelog for details

mac:
  notarize: false
  category: public.app-category.developer-tools
  target:
    target: default
    arch:
      - arm64
      - x64
  type: distribution
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: portable
      arch:
        - x64
  verifyUpdateCodeSignature: false
  # 避免拉取 winCodeSign/rcedit（部分环境解压 7z 时无法创建符号链接导致失败）
  signAndEditExecutable: false
  artifactName: ${productName}-${version}-portable.${ext}
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: assets/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  app: release/app
  buildResources: assets
  output: release/build

extraResources:
  - ./assets/**
  - from: ./voice-app/skill-bundles
    to: skill-bundles
    filter:
      - "**/*"

publish:
  - provider: s3
    bucket: chatbox
    endpoint: https://208624959c9d215edea0720162a740c1.r2.cloudflarestorage.com
    path: /releases
    channel: latest
